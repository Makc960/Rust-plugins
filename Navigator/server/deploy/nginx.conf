# For a server whose ports 80/443 belong to a web server install.sh does not know: an example of
# the Navigator's server as a site of nginx. Put the real domain in, then get the certificate with
#   certbot --nginx -d nav.example.ru
server {
    listen 80;
    server_name nav.example.ru;

    location / {
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64k;
    }
}
