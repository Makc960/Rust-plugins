# For a server that already runs nginx on ports 80/443: install.sh puts this in
# /etc/nginx/conf.d/basedefense-shop.conf with the real domain and gets the certificate with
#   certbot --nginx -d shop.example.ru
server {
    listen 80;
    server_name shop.example.ru;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 16k;
    }
}
