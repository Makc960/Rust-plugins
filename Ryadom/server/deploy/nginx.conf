# For a server whose ports 80/443 belong to a web server install.sh does not know: an example of
# «Рядом» as a site of nginx. Put the real domain in, then get the certificate with
#   certbot --nginx -d friends.example.ru
server {
    listen 80;
    server_name friends.example.ru;

    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 16k;
    }
}
