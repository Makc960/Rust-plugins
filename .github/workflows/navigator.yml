name: Navigator APK

on:
  push:
    branches: ["**"]
    paths:
      - "Navigator/**"
      - ".github/workflows/navigator.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: navigator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Navigator
    env:
      # The private upload key is optional: without these secrets only the GitHub APK is built.
      HAS_UPLOAD_KEY: ${{ secrets.UPLOAD_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Navigator/web/package-lock.json

      - uses: gradle/actions/setup-gradle@v4

      # The interface and the navigation logic are the web part: its tests run first.
      - name: Test the navigator's logic
        working-directory: Navigator/web
        run: |
          npm ci
          npm test

      # The app's own server (road reports, shared drives, search notes): no packages to install.
      - name: Test the navigator's server
        working-directory: Navigator/server
        run: node --test test/*.test.mjs

      - name: Build the APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Name APK
        run: cp app/build/outputs/apk/release/app-release.apk Navigator.apk

      - name: Build the RuStore APK
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          UPLOAD_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks" ./gradlew --no-daemon :app:assembleRelease -Pstore=rustore
          cp app/build/outputs/apk/release/app-release.apk Navigator-RuStore.apk
          rm "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: Navigator
          path: Navigator/Navigator.apk

      - name: Publish to the navigator release
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          FILES="Navigator.apk"
          [ -f Navigator-RuStore.apk ] && FILES="$FILES Navigator-RuStore.apk"
          gh release delete navigator --yes --cleanup-tag || true
          gh release create navigator $FILES \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Навигатор $VERSION" \
            --notes "Сборка из ${GITHUB_SHA::7}. Скачай Navigator.apk на телефон и установи. Navigator-RuStore.apk — сборка для загрузки в RuStore."
