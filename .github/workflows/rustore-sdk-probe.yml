# Temporary: prints the public API of RuStore's Pay SDK, which this sandbox cannot download.
name: RuStore SDK probe

on:
  push:
    paths:
      - ".github/workflows/rustore-sdk-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Dump the Pay SDK
        run: |
          mkdir -p /tmp/probe && cd /tmp/probe
          python3 - <<'PY'
          import re, subprocess, urllib.request, zipfile, os
          REPOS = [
              "https://artifactory-external.vkpartner.ru/artifactory/maven-rustore-exposed",
              "https://nexus-external.rustore.ru/repository/maven-rustore-exposed",
              "https://artifactory-external.vkpartner.ru/artifactory/maven",
          ]
          def get(path):
              for r in REPOS:
                  try:
                      with urllib.request.urlopen(r + "/" + path, timeout=40) as f:
                          print("GOT", r + "/" + path)
                          return f.read()
                  except Exception as e:
                      print("MISS", r + "/" + path, e)
              return None
          meta = get("ru/rustore/sdk/bom/maven-metadata.xml")
          if meta is None:
              raise SystemExit("no BOM metadata")
          versions = re.findall(r"<version>([^<]+)</version>", meta.decode())
          print("BOM VERSIONS", versions)
          bom_v = max(versions)
          bom = get(f"ru/rustore/sdk/bom/{bom_v}/bom-{bom_v}.pom").decode()
          print("===== BOM", bom_v)
          print(bom)
          deps = re.findall(r"<groupId>([^<]+)</groupId>\s*<artifactId>([^<]+)</artifactId>\s*<version>([^<]+)</version>", bom)
          pins = {(g, a): v for g, a, v in deps}
          seen = set()
          todo = [("ru.rustore.sdk", "pay", pins.get(("ru.rustore.sdk", "pay")))]
          jars = []
          while todo:
              g, a, v = todo.pop()
              if (g, a) in seen or v is None:
                  continue
              seen.add((g, a))
              base = g.replace(".", "/") + f"/{a}/{v}/{a}-{v}"
              pom = get(base + ".pom")
              if pom:
                  pom = pom.decode()
                  print("===== POM", g, a, v)
                  print(pom)
                  for dg, da, dv in re.findall(r"<groupId>([^<]+)</groupId>\s*<artifactId>([^<]+)</artifactId>\s*<version>([^<]+)</version>", pom):
                      if dg.startswith("ru.rustore") or dg.startswith("ru.vk"):
                          todo.append((dg, da, pins.get((dg, da), dv)))
              aar = get(base + ".aar")
              if aar:
                  z = zipfile.ZipFile(__import__("io").BytesIO(aar))
                  if "AndroidManifest.xml" in z.namelist():
                      print("===== MANIFEST", g, a, v)
                      print(z.read("AndroidManifest.xml").decode(errors="replace"))
                  for n in z.namelist():
                      if n.endswith(".jar"):
                          p = f"{a}-{os.path.basename(n)}"
                          open(p, "wb").write(z.read(n))
                          jars.append(p)
                  res = [n for n in z.namelist() if n.startswith("res/values")]
                  for n in res:
                      print("===== RES", a, n)
                      print(z.read(n).decode(errors="replace")[:4000])
          cp = ":".join(jars)
          names = []
          for j in jars:
              for n in zipfile.ZipFile(j).namelist():
                  if n.endswith(".class") and n.startswith("ru/rustore/sdk/pay") and "/internal/" not in n:
                      names.append(n[:-6].replace("/", "."))
          print("===== CLASSES", len(names))
          for chunk in range(0, len(names), 60):
              out = subprocess.run(["javap", "-public", "-cp", cp] + names[chunk:chunk + 60], capture_output=True, text=True)
              print(out.stdout)
              print(out.stderr[:2000])
          PY
