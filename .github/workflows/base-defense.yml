name: Base Defense APK

on:
  push:
    paths:
      - "BaseDefense/**"
      - ".github/workflows/base-defense.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: base-defense-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BaseDefense
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test the game and build the APK
        run: ./gradlew --no-daemon :engine:test :app:assembleRelease

      - name: Name APK
        run: cp app/build/outputs/apk/release/app-release.apk BaseDefense.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BaseDefense
          path: BaseDefense/BaseDefense.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BaseDefense-screens
          path: BaseDefense/engine/build/screens

      - name: Publish to the base-defense release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete base-defense --yes --cleanup-tag || true
          gh release create base-defense BaseDefense.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Оборона базы" \
            --notes "Сборка из ${GITHUB_SHA::7}. Скачай BaseDefense.apk на телефон и установи (разреши установку из этого источника)."
