name: ESP Camera APK

on:
  push:
    paths:
      - "EspCamera/**"
      - ".github/workflows/esp-camera.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: esp-camera-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EspCamera
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Name APK
        run: cp app/build/outputs/apk/release/app-release.apk EspCamera.apk

      - uses: actions/upload-artifact@v4
        with:
          name: EspCamera
          path: EspCamera/EspCamera.apk

      - name: Publish to the esp-camera release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete esp-camera --yes --cleanup-tag || true
          gh release create esp-camera EspCamera.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "ESP Camera" \
            --notes "Сборка из ${GITHUB_SHA::7}. Скачай EspCamera.apk на телефон и установи (разреши установку из этого источника)."
